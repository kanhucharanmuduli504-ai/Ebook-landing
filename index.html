<style>
:root{
  --navy:#0F1E3D; --ink:#1B2740; --muted:#5A667D;
  --bg:#F6F7FB; --card:#FFFFFF; --line:#E3E7F0;
  --gold:#F5B700; --gold-d:#D99E00; --blue:#2563EB;
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{font-family:'Plus Jakarta Sans',system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:var(--bg);color:var(--ink);line-height:1.6;-webkit-font-smoothing:antialiased}
.wrap{max-width:560px;margin:0 auto;padding:0 20px}
.topbar{background:var(--navy);color:#fff;text-align:center;padding:12px 16px;font-size:14px;font-weight:600}
.hero{background:linear-gradient(180deg,var(--navy) 0%,#17305F 100%);padding:28px 0 56px;text-align:center;color:#fff}
.cover{width:170px;max-width:48%;border-radius:12px;box-shadow:0 14px 34px rgba(0,0,0,.4);border:2px solid rgba(255,255,255,.15);display:block;margin:0 auto 22px}
.hero h1{font-size:30px;line-height:1.2;font-weight:800;margin-bottom:10px}
.hero p{color:#CBD5EA;font-size:16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:24px 22px;margin-top:-30px;box-shadow:0 10px 30px rgba(15,30,61,.08)}
.card + .card{margin-top:18px}
.price{display:flex;align-items:baseline;justify-content:center;gap:10px;margin-bottom:4px}
.price b{font-size:40px;color:var(--navy);font-weight:800}
.price span{color:var(--muted);font-size:14px}
.sub{text-align:center;color:var(--muted);font-size:14px;margin-bottom:18px}
.btn{display:block;width:100%;text-align:center;text-decoration:none;background:var(--gold);color:#1A1300;font-weight:800;font-size:18px;padding:16px;border-radius:12px;box-shadow:0 6px 16px rgba(217,158,0,.35);transition:background .15s,transform .15s;border:none;cursor:pointer}
.btn:hover{background:var(--gold-d)}
.btn:active{transform:translateY(1px)}
.btn:focus-visible,a:focus-visible{outline:3px solid var(--blue);outline-offset:3px}
.secure{display:flex;justify-content:center;gap:8px;align-items:center;font-size:13px;color:var(--muted);margin-top:12px}
h2{font-size:20px;color:var(--navy);margin-bottom:14px;font-weight:800}
ul.list{list-style:none}
ul.list li{display:flex;gap:12px;align-items:flex-start;padding:12px 0;border-bottom:1px solid var(--line);font-weight:600}
ul.list li:last-child{border-bottom:0}
.n{flex:none;width:28px;height:28px;border-radius:50%;background:var(--navy);color:#fff;font-size:14px;font-weight:700;display:grid;place-items:center}
.preview{margin-top:14px;padding:14px 16px;background:#EEF3FF;border-radius:12px;font-weight:600}
.preview a{color:var(--blue);font-weight:800;text-decoration:underline}
.note{display:flex;gap:14px;align-items:flex-start}
.ico{flex:none;width:44px;height:44px;border-radius:12px;display:grid;place-items:center;font-size:22px}
.ico.g{background:#E7F7EC}.ico.b{background:#E8EEFF}
.note h3{font-size:16px;color:var(--navy);margin-bottom:2px}
.note p{color:var(--muted);font-size:15px}
.contact{text-align:center;color:var(--muted);font-size:14px;padding:26px 0 120px}
.contact a{color:var(--ink);font-weight:700;text-decoration:none}
.contact small{display:block;margin-top:6px}
.sticky{position:fixed;left:0;right:0;bottom:0;background:rgba(255,255,255,.96);backdrop-filter:blur(8px);border-top:1px solid var(--line);padding:12px 16px calc(12px + env(safe-area-inset-bottom,0px));z-index:10}
.sticky .btn{max-width:520px;margin:0 auto}
@media(min-width:640px){.hero h1{font-size:36px}}
</style>
